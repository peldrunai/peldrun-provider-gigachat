name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8.0,<9.0"

      - name: Validate manifest.json
        run: python scripts/validate_manifest.py

      - name: Check version consistency
        run: python scripts/update_version.py --check

      - name: Build the distributable ZIP
        run: python scripts/build_package.py

      - name: Verify the produced ZIP
        run: python scripts/verify_package.py

      - name: Run tests
        run: python -m pytest tests -v

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: provider-package
          path: dist/*.zip
          retention-days: 14